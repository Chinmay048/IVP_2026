[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ivp-pipeline"
version = "1.0.0"
description = "Image Processing Studio - image-processing pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "scikit-image>=0.21",
]

[tool.setuptools]
packages = ["ivp_pipeline", "ivp_pipeline.core", "ivp_pipeline.modules"]

[tool.pytest.ini_options]
markers = ["slow: runtime guards (deselect with -m \"not slow\")"]
